name: Build femiwiki binaries

# One-off build of the extended Pagefind CLI carrying the Korean segmentation +
# chunk-sizing changes on this branch, for femiwiki to consume and for local
# end-to-end testing. Not for upstream; mirrors the linux recipe in release.yml.

on:
  workflow_dispatch:
  push:
    branches: [femiwiki]

permissions:
  contents: read

env:
  WASM_PACK_VERSION: "v0.14.0"

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-unknown-linux-musl
          - aarch64-unknown-linux-musl
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24

      - name: Install MUSL tooling
        run: |
          sudo apt update -y
          sudo apt install -y musl-tools musl-dev

      - name: Install aarch64 musl tooling
        if: matrix.target == 'aarch64-unknown-linux-musl'
        run: |
          sudo apt install -y clang gcc-aarch64-linux-gnu
          curl -sL https://github.com/cross-tools/musl-cross/releases/download/20250929/aarch64-unknown-linux-musl.tar.xz | sudo tar xJ -C /opt/
          echo "CC_aarch64_unknown_linux_musl=/opt/aarch64-unknown-linux-musl/bin/aarch64-unknown-linux-musl-gcc" >> "$GITHUB_ENV"
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER=/opt/aarch64-unknown-linux-musl/bin/aarch64-unknown-linux-musl-gcc" >> "$GITHUB_ENV"

      - name: Install Rust toolchains
        run: |
          rustup toolchain install nightly --component rust-src --target ${{ matrix.target }}
          rustup target add wasm32-unknown-unknown --toolchain nightly
          rustup toolchain install stable --target ${{ matrix.target }}
          rustup default stable

      - name: Install wasm-pack
        uses: jetli/wasm-pack-action@0d096b08b4e5a7de8c28de67e11e945404e9eefa # v0.4.0
        with:
          version: ${{ env.WASM_PACK_VERSION }}

      - name: Build coupled JS (carries the ko query-side segmentation)
        working-directory: ./pagefind_web_js
        run: npm i && npm run build-coupled

      - name: Build WASM
        working-directory: ./pagefind_web
        run: ./local_build.sh

      - name: Build UI
        working-directory: ./pagefind_ui/default
        run: npm i && npm run build

      - name: Build Modular UI
        working-directory: ./pagefind_ui/modular
        run: npm i && npm run build

      - name: Build Component UI
        working-directory: ./pagefind_ui/component
        run: npm i && npm run build

      - name: Build Playground
        working-directory: ./pagefind_playground
        run: npm i && npm run build

      - name: Build extended binary (ko segmentation + chunk sizing)
        working-directory: ./pagefind
        run: cargo build --release --target ${{ matrix.target }} --features extended

      - name: Package
        run: |
          tar czf pagefind-femiwiki-${{ matrix.target }}.tar.gz \
            -C target/${{ matrix.target }}/release pagefind
          sha256sum pagefind-femiwiki-${{ matrix.target }}.tar.gz

      - uses: actions/upload-artifact@v4
        with:
          name: pagefind-femiwiki-${{ matrix.target }}
          path: pagefind-femiwiki-${{ matrix.target }}.tar.gz
          if-no-files-found: error
